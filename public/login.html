<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindBloom</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="logo-link">
                    <span class="logo-icon">🌱</span>
                    <span class="logo-text">MindBloom</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" class="nav-link active">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue your mental wellness journey</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                        <div class="form-error" id="usernameError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                <span class="password-icon">👁️</span>
                            </button>
                        </div>
                        <div class="form-error" id="passwordError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="loginButton">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-spinner" style="display: none;">
                            <div class="spinner"></div>
                        </span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <button class="btn btn-secondary btn-full" onclick="continueAnonymously()">
                    Continue Anonymously
                </button>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Create one here</a></p>
                    <p><a href="index.html">← Back to Home</a></p>
                </div>
            </div>

            <div class="auth-visual">
                <div class="wellness-illustration">
                    <div class="mood-bubbles">
                        <div class="mood-bubble">😊</div>
                        <div class="mood-bubble">🌱</div>
                        <div class="mood-bubble">💚</div>
                    </div>
                    <h3>Your wellness journey continues</h3>
                    <p>Track your moods, reflect on your thoughts, and grow with our supportive community.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Signing you in...</p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
